name: deploy-railway
on:
  workflow_dispatch:
  workflow_run:
    workflows: [ci]
    types: [completed]
permissions:
  contents: read
concurrency:
  group: railway-production
  cancel-in-progress: false
jobs:
  deploy:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    services:
      postgres-review:
        image: postgres:17
        env:
          POSTGRES_USER: fs_review
          POSTGRES_PASSWORD: fixture-review-only
          POSTGRES_DB: fs_v3_review
        ports:
          - 55439:5432
        options: >-
          --health-cmd "pg_isready -U fs_review -d fs_v3_review"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_PROJECT_ID: c6113f7b-af28-408f-b32a-0fe1b3911853
      RAILWAY_TARGET_ENVIRONMENT: production
      FS_PUBLIC_BASE_URL: https://control-plane-production-d25c.up.railway.app
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      RAILWAY_CLI_VERSION: 5.63.0
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Check deployment credentials
        id: credentials
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$DEPLOY_SHA"
          test "${{ github.event.workflow_run.head_branch || github.ref_name }}" = "main"
          if [[ -n "$RAILWAY_TOKEN" ]]; then
            echo 'configured=true' >> "$GITHUB_OUTPUT"
          else
            echo 'configured=false' >> "$GITHUB_OUTPUT"
            echo 'Railway deployment skipped: configure the RAILWAY_TOKEN repository secret to enable automated production rollout.'
          fi
      - name: Install and validate verified revision
        run: |
          npm ci
          npm run validate
      - name: Verify isolated PostgreSQL and real-node journeys before production changes
        env:
          FS_REVIEW_PG_URL: postgresql://fs_review:fixture-review-only@127.0.0.1:55439/fs_v3_review
          FS_REMOTE_INSTANCE_ID: isolated-deploy-review
          FS_REMOTE_STATE_ROOT: /tmp/fs-v3-review-deploy
        run: npm run test:postgres
      - name: Link Railway production project
        if: steps.credentials.outputs.configured == 'true'
        run: npx -y @railway/cli@${RAILWAY_CLI_VERSION} link --project "$RAILWAY_PROJECT_ID" --environment "$RAILWAY_TARGET_ENVIRONMENT"
      - name: Verify required production variables without printing values
        if: steps.credentials.outputs.configured == 'true'
        shell: bash
        run: |
          npx -y @railway/cli@${RAILWAY_CLI_VERSION} variable list --service control-plane --environment "$RAILWAY_TARGET_ENVIRONMENT" --json \
            | node --import tsx scripts/railway-variable-preflight.mts control-plane DATABASE_URL,FS_REMOTE_ACTIONS_SECRET,FS_REMOTE_ENDPOINT_SECRET,FS_REMOTE_ENVIRONMENT,FS_REMOTE_HOSTED,FS_REMOTE_INSTANCE_ID,FS_REMOTE_PUBLIC_BASE_URL,FS_REMOTE_STATE_ROOT
          npx -y @railway/cli@${RAILWAY_CLI_VERSION} variable list --service autonomous-worker --environment "$RAILWAY_TARGET_ENVIRONMENT" --json \
            | node --import tsx scripts/railway-variable-preflight.mts autonomous-worker DATABASE_URL,FS_REMOTE_ACTIONS_SECRET,FS_REMOTE_ENDPOINT_SECRET,FS_REMOTE_ENVIRONMENT,FS_REMOTE_INSTANCE_ID,FS_REMOTE_STATE_ROOT,GITHUB_TOKEN,OPENROUTER_API_KEY
      - name: Stamp exact revision on both app services
        if: steps.credentials.outputs.configured == 'true'
        shell: bash
        run: |
          npx -y @railway/cli@${RAILWAY_CLI_VERSION} variable set "FS_BUILD_REVISION=$DEPLOY_SHA" --service control-plane --environment "$RAILWAY_TARGET_ENVIRONMENT" --skip-deploys >/dev/null
          npx -y @railway/cli@${RAILWAY_CLI_VERSION} variable set "FS_BUILD_REVISION=$DEPLOY_SHA" --service autonomous-worker --environment "$RAILWAY_TARGET_ENVIRONMENT" --skip-deploys >/dev/null
      - name: Deploy control plane under existing Railway health policy
        if: steps.credentials.outputs.configured == 'true'
        run: npx -y @railway/cli@${RAILWAY_CLI_VERSION} up --ci --project "$RAILWAY_PROJECT_ID" --service control-plane --environment "$RAILWAY_TARGET_ENVIRONMENT" --message "GitHub $DEPLOY_SHA control-plane"
      - name: Verify new control plane fail-closed readiness and exact revision
        if: steps.credentials.outputs.configured == 'true'
        run: node --import tsx scripts/railway-ready-check.mts "$FS_PUBLIC_BASE_URL" "$DEPLOY_SHA"
      - name: Plan Railway IaC migration
        if: steps.credentials.outputs.configured == 'true'
        shell: bash
        run: |
          npx -y @railway/cli@${RAILWAY_CLI_VERSION} config plan --json --out railway-production.plan > railway-plan.json
          node --import tsx scripts/railway-plan-guard.mts railway-plan.json
      - name: Apply pinned Railway IaC plan
        if: steps.credentials.outputs.configured == 'true'
        run: npx -y @railway/cli@${RAILWAY_CLI_VERSION} config apply --plan railway-production.plan --yes
      - name: Re-verify control plane after Railway health-policy migration
        if: steps.credentials.outputs.configured == 'true'
        run: node --import tsx scripts/railway-ready-check.mts "$FS_PUBLIC_BASE_URL" "$DEPLOY_SHA"
      - name: Deploy autonomous worker from the same revision
        if: steps.credentials.outputs.configured == 'true'
        run: npx -y @railway/cli@${RAILWAY_CLI_VERSION} up --ci --project "$RAILWAY_PROJECT_ID" --service autonomous-worker --environment "$RAILWAY_TARGET_ENVIRONMENT" --message "GitHub $DEPLOY_SHA autonomous-worker"
      - name: Verify autonomous worker deployment revision
        if: steps.credentials.outputs.configured == 'true'
        shell: bash
        run: |
          npx -y @railway/cli@${RAILWAY_CLI_VERSION} deployment list --service autonomous-worker --environment "$RAILWAY_TARGET_ENVIRONMENT" --limit 1 --json \
            | node --import tsx scripts/railway-deployment-check.mts "$DEPLOY_SHA"
      - name: Verify Railway IaC converged
        if: steps.credentials.outputs.configured == 'true'
        shell: bash
        run: |
          npx -y @railway/cli@${RAILWAY_CLI_VERSION} config plan --json > railway-post-plan.json
          node --import tsx scripts/railway-plan-guard.mts railway-post-plan.json
          node -e "const p=require('./railway-post-plan.json'); if((p.changeSet?.changes??[]).length) process.exit(1)"
