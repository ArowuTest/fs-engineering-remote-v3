name: deploy-railway
on:
  workflow_dispatch:
  workflow_run:
    workflows: [ci]
    types: [completed]
permissions:
  contents: read
concurrency:
  group: railway-production
  cancel-in-progress: false
jobs:
  deploy:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_PROJECT_ID: c6113f7b-af28-408f-b32a-0fe1b3911853
      RAILWAY_ENVIRONMENT: production
      FS_PUBLIC_BASE_URL: https://control-plane-production-d25c.up.railway.app
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      RAILWAY_CLI_VERSION: 5.63.0
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Check deployment credentials
        shell: bash
        run: |
          test -n "$RAILWAY_TOKEN"
          test "$(git rev-parse HEAD)" = "$DEPLOY_SHA"
          test "${{ github.event.workflow_run.head_branch || github.ref_name }}" = "main"
      - name: Install and validate verified revision
        run: |
          npm ci
          npm run validate
      - name: Link Railway production project
        run: npx -y @railway/cli@${RAILWAY_CLI_VERSION} link --project "$RAILWAY_PROJECT_ID" --environment "$RAILWAY_ENVIRONMENT"
      - name: Verify required production variables without printing values
        shell: bash
        run: |
          npx -y @railway/cli@${RAILWAY_CLI_VERSION} variable list --service control-plane --environment "$RAILWAY_ENVIRONMENT" --json \
            | node --import tsx scripts/railway-variable-preflight.mts control-plane DATABASE_URL,FS_REMOTE_ACTIONS_SECRET,FS_REMOTE_ENDPOINT_SECRET,FS_REMOTE_ENVIRONMENT,FS_REMOTE_HOSTED,FS_REMOTE_INSTANCE_ID,FS_REMOTE_PUBLIC_BASE_URL,FS_REMOTE_STATE_ROOT
          npx -y @railway/cli@${RAILWAY_CLI_VERSION} variable list --service autonomous-worker --environment "$RAILWAY_ENVIRONMENT" --json \
            | node --import tsx scripts/railway-variable-preflight.mts autonomous-worker DATABASE_URL,FS_REMOTE_ACTIONS_SECRET,FS_REMOTE_ENDPOINT_SECRET,FS_REMOTE_ENVIRONMENT,FS_REMOTE_INSTANCE_ID,FS_REMOTE_STATE_ROOT,GITHUB_TOKEN,OPENROUTER_API_KEY
      - name: Stamp exact revision on both app services
        shell: bash
        run: |
          npx -y @railway/cli@${RAILWAY_CLI_VERSION} variable set "FS_BUILD_REVISION=$DEPLOY_SHA" --service control-plane --environment "$RAILWAY_ENVIRONMENT" --skip-deploys >/dev/null
          npx -y @railway/cli@${RAILWAY_CLI_VERSION} variable set "FS_BUILD_REVISION=$DEPLOY_SHA" --service autonomous-worker --environment "$RAILWAY_ENVIRONMENT" --skip-deploys >/dev/null
      - name: Deploy control plane under existing Railway health policy
        run: npx -y @railway/cli@${RAILWAY_CLI_VERSION} up --ci --project "$RAILWAY_PROJECT_ID" --service control-plane --environment "$RAILWAY_ENVIRONMENT" --message "GitHub $DEPLOY_SHA control-plane"
      - name: Verify new control plane fail-closed readiness and exact revision
        run: node --import tsx scripts/railway-ready-check.mts "$FS_PUBLIC_BASE_URL" "$DEPLOY_SHA"
      - name: Plan Railway IaC migration
        shell: bash
        run: |
          npx -y @railway/cli@${RAILWAY_CLI_VERSION} config plan --json --out railway-production.plan > railway-plan.json
          node --import tsx scripts/railway-plan-guard.mts railway-plan.json
      - name: Apply pinned Railway IaC plan
        run: npx -y @railway/cli@${RAILWAY_CLI_VERSION} config apply --plan railway-production.plan --yes
      - name: Re-verify control plane after Railway health-policy migration
        run: node --import tsx scripts/railway-ready-check.mts "$FS_PUBLIC_BASE_URL" "$DEPLOY_SHA"
      - name: Deploy autonomous worker from the same revision
        run: npx -y @railway/cli@${RAILWAY_CLI_VERSION} up --ci --project "$RAILWAY_PROJECT_ID" --service autonomous-worker --environment "$RAILWAY_ENVIRONMENT" --message "GitHub $DEPLOY_SHA autonomous-worker"
      - name: Verify autonomous worker deployment revision
        shell: bash
        run: |
          npx -y @railway/cli@${RAILWAY_CLI_VERSION} deployment list --service autonomous-worker --environment "$RAILWAY_ENVIRONMENT" --limit 1 --json \
            | node --import tsx scripts/railway-deployment-check.mts "$DEPLOY_SHA"
      - name: Verify Railway IaC converged
        shell: bash
        run: |
          npx -y @railway/cli@${RAILWAY_CLI_VERSION} config plan --json > railway-post-plan.json
          node --import tsx scripts/railway-plan-guard.mts railway-post-plan.json
          node -e "const p=require('./railway-post-plan.json'); if((p.changeSet?.changes??[]).length) process.exit(1)"
