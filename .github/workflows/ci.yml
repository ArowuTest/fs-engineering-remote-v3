name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Platform execution smoke
        run: node --import tsx --test tests/platform-contract.test.ts tests/process-shell.test.ts tests/processes.test.ts tests/server.integration.test.ts
